<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Snapshot</title>
  <link rel="stylesheet" href="capture.css">
</head>
<body>
  <main>
    <h1>Page Snapshot</h1>
    <p id="source" class="muted"></p>
    <progress id="bar"></progress>
    <p id="status" role="status">Starting…</p>
    <p id="now" class="muted"></p>
    <ol id="steps" aria-label="What the extension is doing"></ol>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="notes" class="muted" hidden></ul>
    <details id="failed-box" hidden>
      <summary id="failed-summary"></summary>
      <ul id="failed"></ul>
    </details>
  </main>
  <footer id="buttons">
    <button id="download" type="button" hidden>Download again</button>
    <button id="cancel" type="button">Cancel</button>
    <button id="ok" type="button" class="primary" disabled>OK</button>
  </footer>
  <script type="module" src="capture.js"></script>
</body>
</html>
