<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PageKeep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Texts come from _locales through data-i18n (element text) and data-i18n-label
       (aria-label); see translatePage() in popup.js. -->
  <main>
    <h1 data-i18n="app_name"></h1>
    <p id="source" class="muted"></p>
    <p id="other" class="note" hidden data-i18n="other_tab"></p>
    <details id="help">
      <summary data-i18n="help"></summary>
      <p data-i18n="help_intro"></p>
      <ul>
        <li><strong data-i18n="help_close_label"></strong> <span data-i18n="help_close"></span></li>
        <li><strong data-i18n="snapshot"></strong> <span data-i18n="help_snapshot"></span></li>
        <li><strong data-i18n="help_reveal_label"></strong> <span data-i18n="help_reveal"></span></li>
        <li><strong data-i18n="help_choices_label"></strong> <span data-i18n="help_choices"></span></li>
        <li><strong data-i18n="option_format"></strong> <span data-i18n="help_format"></span></li>
        <li><strong data-i18n="download"></strong> <span data-i18n="help_download"></span></li>
        <li><strong data-i18n="cancel"></strong> <span data-i18n="help_cancel"></span></li>
        <li data-i18n="help_one"></li>
        <li data-i18n="help_unzip"></li>
      </ul>
      <p id="signing" hidden>
        <span data-i18n="help_key"></span>
        <code id="fingerprint"></code>
        <button id="copy-fingerprint" type="button" data-i18n="copy"></button>
      </p>
      <p><a id="help-page" href="help.html" target="_blank" data-i18n="help_full"></a></p>
    </details>
    <label class="option"><input type="checkbox" id="opt-reveal"> <span data-i18n="option_reveal"></span></label>
    <label class="option"><input type="checkbox" id="opt-choices"> <span data-i18n="option_choices"></span></label>
    <fieldset class="option" id="opt-format">
      <legend data-i18n="option_format"></legend>
      <label><input type="radio" name="format" value="zip"> .zip</label>
      <label><input type="radio" name="format" value="wsnp"> .wsnp</label>
    </fieldset>
    <progress id="bar"></progress>
    <p id="status" role="status" data-i18n="status_idle"></p>
    <p id="now" class="muted"></p>
    <ol id="steps" data-i18n-label="steps_label"></ol>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="notes" class="muted" hidden></ul>
    <details id="failed-box" hidden>
      <summary id="failed-summary"></summary>
      <ul id="failed"></ul>
    </details>
  </main>
  <footer id="buttons">
    <button id="snapshot" type="button" class="primary" data-i18n="snapshot"></button>
    <button id="cancel" type="button" disabled data-i18n="cancel"></button>
    <button id="download" type="button" class="primary" disabled data-i18n="download"></button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
