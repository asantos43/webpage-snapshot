# Publishes a release of the extension, by hand only (Actions → Release → Run workflow, on main).
# Nothing is written to main here (its rules only take pull requests): a release is prepared in a
# pull request that sets "version" in page-snapshot-extension/manifest.json and turns the
# changelog's "Unreleased" section into "## [x.y.z] - date"; once it is merged, this workflow
# releases that version (refused if it has a release already): the tests must pass, then the
# extension folder (plus CHANGELOG.md) is zipped and published as the GitHub release v<version>,
# whose notes are that changelog section. The zip goes to the Chrome Web Store for review only when
# "store" is ticked (never for a pre-release, and only with the CWS_* secrets set). A release
# already published can be sent later with the "Send to the Chrome Web Store" workflow (store.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      store:
        description: 'Also send it to the Chrome Web Store for review'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  EXT_DIR: page-snapshot-extension

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main (was ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v7

      - name: The version, and its changelog section
        id: version
        run: |
          version=$(jq -r .version "$EXT_DIR/manifest.json")
          # Chrome accepts one to four dot-separated integers.
          if ! [[ $version =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid version '$version' in manifest.json."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Raise \"version\" in manifest.json in a pull request first."
            exit 1
          fi
          VERSION=$version python3 - <<'EOF'
          import os, re, sys
          version = os.environ['VERSION']
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # Each section runs from its "## [name]" heading to the next one.
          heads = list(re.finditer(r'^## \[([^\]]+)\].*$', text, re.M))
          for i, m in enumerate(heads):
              if m.group(1) == version:
                  end = heads[i + 1].start() if i + 1 < len(heads) else len(text)
                  notes = text[m.end():end].strip()
                  break
          else:
              print(f'::error::CHANGELOG.md has no "## [{version}]" section. In the pull request that prepares the release, turn "## [Unreleased]" into "## [{version}] - <date>" (keeping an empty "## [Unreleased]" above it).')
              sys.exit(1)
          open('changelog-notes.md', 'w', encoding='utf-8').write((notes or 'No changes were listed in CHANGELOG.md.') + '\n')
          EOF
          cat changelog-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright and its Chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: tests
        run: npm run smoke

      - name: Carousel end-to-end test
        working-directory: tests
        run: npm run carousel

      - name: Offline library end-to-end test
        working-directory: tests
        run: npm run library

      - name: Choices end-to-end test ("Record what each choice shows")
        working-directory: tests
        run: npm run choices

      - name: Image readers end-to-end test
        working-directory: tests
        run: npm run sequence

      - name: Store policy checks
        working-directory: tests
        run: npm run store-policy

      - name: Store upload script test (against a fake store)
        working-directory: tests
        run: npm run publish-script

      - name: WSNP format checks (validator and password protection)
        working-directory: tests
        run: npm run wsnp

      - name: Build the zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="pagekeep-$VERSION.zip"
          # Only the files git tracks, plus the changelog.
          git ls-files "$EXT_DIR" > files.txt
          (cd "$EXT_DIR" && sed "s|^$EXT_DIR/||" ../files.txt | zip -X -q "../$name" -@)
          zip -X -q -j "$name" CHANGELOG.md
          unzip -l "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cp changelog-notes.md notes.md
          cat >> notes.md <<EOF

          ---

          Works in Chromium browsers such as Chrome, Opera and Edge. Unpack the zip into a fixed folder and load it in \`chrome://extensions\`, \`opera://extensions\` or \`edge://extensions\` (Developer mode → Load unpacked).
          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" "$ZIP" \
            --target "$(git rev-parse HEAD)" \
            --title "PageKeep $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"

      # Uploads the same zip to the Chrome Web Store and submits it for review
      # (.github/scripts/publish-to-chrome-web-store.sh, store/PUBLISHING.md step 6), only when
      # "store" is ticked. Without the three CWS_* secrets it only prints a notice. Never for a
      # pre-release.
      - name: Send to the Chrome Web Store
        if: inputs.prerelease != true && inputs.store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: .github/scripts/publish-to-chrome-web-store.sh "${{ steps.zip.outputs.name }}"
